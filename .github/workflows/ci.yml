name: ci

# Os tres sistemas alvo sao construidos e testados a cada mudanca. O objetivo
# nao e empacotar aqui — e impedir que core/ ganhe dependencia de plataforma
# sem ninguem perceber (AR-07, AR-08).

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: linux,   os: ubuntu-latest }
          - { name: windows, os: windows-latest }
          - { name: macos,   os: macos-latest }

    steps:
      - uses: actions/checkout@v4

      - name: Dependencias (Linux)
        if: matrix.name == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build pkg-config \
            qt6-base-dev qt6-base-dev-tools libgl1-mesa-dev \
            libavformat-dev libavcodec-dev libavutil-dev libswresample-dev

      - name: Dependencias (macOS)
        if: matrix.name == 'macos'
        run: |
          brew install ninja pkg-config ffmpeg qt@6
          echo "CMAKE_PREFIX_PATH=$(brew --prefix qt@6)" >> "$GITHUB_ENV"

      # O gerador Ninja precisa do ambiente do MSVC no PATH. Sem isto o cmake
      # nao acha cl.exe e a configuracao falha antes de qualquer compilacao.
      - name: Ambiente MSVC (Windows)
        if: matrix.name == 'windows'
        uses: ilammy/msvc-dev-cmd@v1

      - name: Qt (Windows)
        if: matrix.name == 'windows'
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.*'

      # FFmpeg pronto, e nao compilado pelo vcpkg. O vcpkg constroi da fonte e
      # leva dezenas de minutos por execucao, o que inviabiliza iterar; o build
      # "gpl-shared" do BtbN traz cabecalhos e .lib prontos e e coerente com a
      # licenca do projeto, que e GPL-3.0-or-later.
      - name: FFmpeg (Windows)
        if: matrix.name == 'windows'
        shell: bash
        run: |
          set -euo pipefail
          url=https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-win64-gpl-shared.zip
          curl -sL -o ffmpeg.zip "$url"
          7z x -y -offmpeg ffmpeg.zip > /dev/null
          raiz=$(echo "$PWD"/ffmpeg/ffmpeg-*-win64-gpl-shared)
          echo "FFMPEG_ROOT=$raiz" >> "$GITHUB_ENV"
          echo "CMAKE_PREFIX_PATH=$raiz${CMAKE_PREFIX_PATH:+;$CMAKE_PREFIX_PATH}" >> "$GITHUB_ENV"
          # As DLLs precisam estar no PATH para os testes RODAREM, e nao so
          # para o link — e em FORMATO DO WINDOWS. Este passo roda no bash do
          # Git for Windows, onde $PWD e "/d/a/...": o cmake aceita, o
          # carregador de DLL do Windows nao. Foi exatamente isso que fez dez
          # testes morrerem com 0xC0000135 (DLL nao encontrada) e o ctest
          # esperar o prazo inteiro por um processo que ja estava morto.
          echo "$(cygpath -w "$raiz")\bin" >> "$GITHUB_PATH"
          ls "$raiz"

      # O leitor de .wsz usa inflate cru do zlib. O Qt para Windows nao expoe
      # cabecalho de zlib, entao ele vem do vcpkg — que ja esta no runner e
      # compila zlib em segundos. ZLIB_ROOT basta: nao trocamos o toolchain,
      # para nao interferir na busca do FFmpeg.
      - name: zlib (Windows)
        if: matrix.name == 'windows'
        shell: bash
        run: |
          set -euo pipefail
          "$VCPKG_INSTALLATION_ROOT/vcpkg" install zlib:x64-windows
          instalado="$VCPKG_INSTALLATION_ROOT/installed/x64-windows"
          echo "ZLIB_ROOT=$instalado" >> "$GITHUB_ENV"
          # zlib1.dll, pelo mesmo motivo do FFmpeg.
          echo "$(cygpath -w "$instalado")\bin" >> "$GITHUB_PATH"

      # Os testes de rede, de dispositivo e de barramento sao orquestrados por
      # Python. Ele ja vem nos runners; a linha existe para falhar cedo e com
      # mensagem clara se algum dia nao vier.
      - name: Conferir Python
        shell: bash
        run: python3 --version

      - name: Configurar
        shell: bash
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=RelWithDebInfo

      - name: Compilar
        run: cmake --build build

      # Runner nao tem placa de som, tela nem barramento de sessao. Os testes
      # que dependem disso se declaram PULADOS (codigo 77) em vez de reprovar:
      # a ausencia desses recursos numa maquina de integracao nao e defeito do
      # player, e reprovar por isso treinaria a equipe a ignorar a suite.
      - name: Testar
        shell: bash
        env:
          QT_QPA_PLATFORM: offscreen
        # --timeout e o prazo PADRAO, aplicado a quem nao declarou o seu. Sem
        # ele, um teste que trava no Windows prende a maquina de integracao por
        # horas e nao diz sequer o proprio nome; com ele, vira uma reprovacao
        # identificada em tres minutos.
        run: ctest --test-dir build --output-on-failure --no-tests=error --timeout 180

      # EN-09 — o instalador e montado no proprio CI para que nunca dependa da
      # maquina de um desenvolvedor. Reaproveita o diretorio `build` ja
      # compilado: o cmake so reconfigura, e nao recompila.
      - name: Instalador (Windows)
        if: matrix.name == 'windows'
        shell: pwsh
        run: packaging/windows/build-installer.ps1 -FfmpegRoot "$env:FFMPEG_ROOT" -BuildDir build

      - name: Publicar instalador
        if: matrix.name == 'windows'
        uses: actions/upload-artifact@v4
        with:
          name: playampng-windows
          path: |
            packaging/windows/*-setup.exe
            dist/windows/
