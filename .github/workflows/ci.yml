name: ci

# Os tres sistemas alvo sao construidos e testados a cada mudanca. O objetivo
# nao e empacotar aqui — e impedir que core/ ganhe dependencia de plataforma
# sem ninguem perceber (AR-07, AR-08).

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: linux,   os: ubuntu-latest }
          - { name: windows, os: windows-latest }
          - { name: macos,   os: macos-latest }

    steps:
      - uses: actions/checkout@v4

      - name: Dependencias (Linux)
        if: matrix.name == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build pkg-config \
            qt6-base-dev qt6-base-dev-tools qt6-wayland libgl1-mesa-dev \
            libavformat-dev libavcodec-dev libavutil-dev libswresample-dev

      - name: Dependencias (macOS)
        if: matrix.name == 'macos'
        run: |
          brew install ninja pkg-config ffmpeg

      # O gerador Ninja precisa do ambiente do MSVC no PATH. Sem isto o cmake
      # nao acha cl.exe e a configuracao falha antes de qualquer compilacao.
      - name: Ambiente MSVC (Windows)
        if: matrix.name == 'windows'
        uses: ilammy/msvc-dev-cmd@v1

      - name: Qt (Windows)
        if: matrix.name == 'windows'
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.*'

      # Qt oficial tambem no macOS, e nao o do Homebrew. O do Homebrew vem
      # fatiado em pacotes separados (qtbase, qtsvg, qtpdf...), e o
      # macdeployqt nao resolvia as bibliotecas entre eles: o pacote saia com
      # plugins quebrados. O oficial vem inteiro.
      #
      # 6.10, e nao o 6.8 do Windows: o 6.8 liga o framework AGL, que a Apple
      # removeu do SDK do Xcode 26 — "ld: framework 'AGL' not found".
      - name: Qt (macOS)
        if: matrix.name == 'macos'
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.10.*'

      # FFmpeg pronto, e nao compilado pelo vcpkg. O vcpkg constroi da fonte e
      # leva dezenas de minutos por execucao, o que inviabiliza iterar; o build
      # "gpl-shared" do BtbN traz cabecalhos e .lib prontos e e coerente com a
      # licenca do projeto, que e GPL-3.0-or-later.
      - name: FFmpeg (Windows)
        if: matrix.name == 'windows'
        shell: bash
        run: |
          set -euo pipefail
          url=https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-win64-gpl-shared.zip
          curl -sL -o ffmpeg.zip "$url"
          7z x -y -offmpeg ffmpeg.zip > /dev/null
          # Forma MISTA ("D:/a/..."), e nao a do MSYS ("/d/a/..."): o bash, o
          # cmake e o PowerShell entendem todos a primeira, e so o bash entende
          # a segunda. Publicar o caminho MSYS fez o PowerShell do instalador
          # procurar em "D:\d\a\..." e nao achar as DLLs do FFmpeg.
          raiz=$(cygpath -m "$(echo "$PWD"/ffmpeg/ffmpeg-*-win64-gpl-shared)")
          echo "FFMPEG_ROOT=$raiz" >> "$GITHUB_ENV"
          echo "CMAKE_PREFIX_PATH=$raiz${CMAKE_PREFIX_PATH:+;$CMAKE_PREFIX_PATH}" >> "$GITHUB_ENV"
          # As DLLs precisam estar no PATH para os testes RODAREM, e nao so
          # para o link — e em FORMATO DO WINDOWS. Este passo roda no bash do
          # Git for Windows, onde $PWD e "/d/a/...": o cmake aceita, o
          # carregador de DLL do Windows nao. Foi exatamente isso que fez dez
          # testes morrerem com 0xC0000135 (DLL nao encontrada) e o ctest
          # esperar o prazo inteiro por um processo que ja estava morto.
          echo "$(cygpath -w "$raiz")\bin" >> "$GITHUB_PATH"
          ls "$raiz"

      # O leitor de .wsz usa inflate cru do zlib. O Qt para Windows nao expoe
      # cabecalho de zlib, entao ele vem do vcpkg — que ja esta no runner e
      # compila zlib em segundos. ZLIB_ROOT basta: nao trocamos o toolchain,
      # para nao interferir na busca do FFmpeg.
      - name: zlib (Windows)
        if: matrix.name == 'windows'
        shell: bash
        run: |
          set -euo pipefail
          "$VCPKG_INSTALLATION_ROOT/vcpkg" install zlib:x64-windows
          instalado="$VCPKG_INSTALLATION_ROOT/installed/x64-windows"
          echo "ZLIB_ROOT=$instalado" >> "$GITHUB_ENV"
          # zlib1.dll, pelo mesmo motivo do FFmpeg.
          echo "$(cygpath -w "$instalado")\bin" >> "$GITHUB_PATH"

      # Os testes de rede, de dispositivo e de barramento sao orquestrados por
      # Python. Ele ja vem nos runners; a linha existe para falhar cedo e com
      # mensagem clara se algum dia nao vier.
      - name: Conferir Python
        shell: bash
        run: python3 --version

      - name: Configurar
        shell: bash
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=RelWithDebInfo

      - name: Compilar
        run: cmake --build build

      # Runner nao tem placa de som, tela nem barramento de sessao. Os testes
      # que dependem disso se declaram PULADOS (codigo 77) em vez de reprovar:
      # a ausencia desses recursos numa maquina de integracao nao e defeito do
      # player, e reprovar por isso treinaria a equipe a ignorar a suite.
      - name: Testar
        shell: bash
        env:
          QT_QPA_PLATFORM: offscreen
        # --timeout e o prazo PADRAO, aplicado a quem nao declarou o seu. Sem
        # ele, um teste que trava no Windows prende a maquina de integracao por
        # horas e nao diz sequer o proprio nome; com ele, vira uma reprovacao
        # identificada em tres minutos.
        run: ctest --test-dir build --output-on-failure --no-tests=error --timeout 180

      # EN-04 — o AppImage tambem e montado no CI, pelo mesmo motivo do
      # instalador do Windows: um pacote que so sai da maquina de um
      # desenvolvedor nao e verificavel por mais ninguem.
      - name: AppImage (Linux)
        if: matrix.name == 'linux'
        env:
          # O Ubuntu 24.04 nao traz mais o libfuse2, e as ferramentas do
          # linuxdeploy sao elas proprias AppImages. Extrair em vez de montar
          # dispensa o FUSE e nao precisa de root.
          APPIMAGE_EXTRACT_AND_RUN: 1
        run: packaging/linux/build-appimage.sh

      - name: Publicar AppImage
        if: matrix.name == 'linux'
        uses: actions/upload-artifact@v4
        with:
          name: playampng-linux
          if-no-files-found: error
          path: dist/PlayAmpNG-x86_64.AppImage

      # EN-10 — o .dmg do macOS. Sem assinatura: exige conta de desenvolvedor
      # Apple, decisao a parte. O script confere vinculos e de onde o skin e
      # carregado, porque defeito de pacote nao aparece na maquina que o monta.
      - name: Pacote (macOS)
        if: matrix.name == 'macos'
        run: packaging/macos/build-dmg.sh build dist

      - name: Publicar pacote (macOS)
        if: matrix.name == 'macos'
        uses: actions/upload-artifact@v4
        with:
          name: playampng-macos
          if-no-files-found: error
          path: dist/*.dmg

      # EN-09 — o instalador e montado no proprio CI para que nunca dependa da
      # maquina de um desenvolvedor. Reaproveita o diretorio `build` ja
      # compilado: o cmake so reconfigura, e nao recompila.
      # O runner nao traz NSIS. Sem ele o script monta o diretorio que roda por
      # si so, mas nao gera o instalador — que e justamente o entregavel do
      # EN-09.
      - name: NSIS (Windows)
        if: matrix.name == 'windows'
        run: choco install nsis -y --no-progress

      - name: Instalador (Windows)
        if: matrix.name == 'windows'
        shell: pwsh
        run: |
          packaging/windows/build-installer.ps1 -FfmpegRoot "$env:FFMPEG_ROOT" -BuildDir build
          # O script degrada com aviso quando falta NSIS, o que e certo para
          # quem so quer o diretorio. No CI, nao: aqui o instalador E o
          # entregavel, e um aviso passaria despercebido.
          if (-not (Get-ChildItem packaging/windows/*-setup.exe -ErrorAction SilentlyContinue)) {
            throw "instalador nao foi gerado"
          }

      - name: Publicar instalador
        if: matrix.name == 'windows'
        uses: actions/upload-artifact@v4
        with:
          name: playampng-windows
          # Falha quando nao ha o que publicar: sem isto, um instalador que
          # deixou de ser gerado vira um artefato so com o diretorio solto, e
          # ninguem percebe ate tentar instalar.
          if-no-files-found: error
          path: |
            packaging/windows/*-setup.exe
            dist/windows/

  # EN-04 — Flatpak.
  #
  # Job proprio, e nao um passo do Linux, porque baixa o runtime e o SDK do KDE
  # (alguns gigabytes) e nao deve atrasar o retorno da suite. Fora de
  # pull_request pelo mesmo motivo.
  flatpak:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Dependencias
        run: |
          sudo apt-get update
          sudo apt-get install -y flatpak flatpak-builder
          flatpak remote-add --user --if-not-exists flathub \
            https://flathub.org/repo/flathub.flatpakrepo
          flatpak install --user -y flathub org.kde.Platform//6.9 org.kde.Sdk//6.9

      # Sem --share=network no build: o manifesto declara tudo o que entra,
      # fixado por commit. E o requisito do Flathub e a condicao para o pacote
      # ser reprodutivel.
      - name: Construir
        run: |
          flatpak-builder --user --force-clean --repo=repo-flatpak \
            build-flatpak packaging/linux/br.com.playampng.PlayAmpNG.yml
          # --runtime-repo: o pacote leva o endereco de onde baixar o runtime
          # do KDE. Sem isto, instalar num sistema sem o Flathub configurado —
          # um Ubuntu recem-instalado, por exemplo — falha sem achar o runtime.
          flatpak build-bundle \
            --runtime-repo=https://flathub.org/repo/flathub.flatpakrepo \
            repo-flatpak PlayAmpNG.flatpak br.com.playampng.PlayAmpNG

      - uses: actions/upload-artifact@v4
        with:
          name: playampng-flatpak
          if-no-files-found: error
          path: PlayAmpNG.flatpak

  # Publicacao.
  #
  # So roda para tag "v*", e o release nasce como RASCUNHO: quem decide torna-lo
  # publico e uma pessoa, olhando os arquivos, e nao um push. Os binarios sao os
  # mesmos que a suite acabou de aprovar — nao ha recompilacao aqui, nem upload
  # da maquina de ninguem.
  release:
    needs: [build, flatpak]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artefatos

      - name: Reunir o que se publica
        run: |
          set -euo pipefail
          mkdir -p publicar
          cp artefatos/playampng-linux/PlayAmpNG-x86_64.AppImage publicar/
          cp artefatos/playampng-windows/packaging/windows/*-setup.exe publicar/
          cp artefatos/playampng-flatpak/PlayAmpNG.flatpak publicar/
          cp artefatos/playampng-macos/*.dmg publicar/
          (cd publicar && sha256sum * > SHA256SUMS.txt)
          ls -l publicar

      - uses: softprops/action-gh-release@v2
        with:
          draft: true
          files: publicar/*
          body: |
            Construido e testado pelo CI a partir de ${{ github.sha }}.

            | Sistema | Arquivo |
            |---|---|
            | Linux x86_64 | `PlayAmpNG-x86_64.AppImage` — `chmod +x` e executar; nao instala nada, nao precisa de root. Exige **glibc 2.39 ou mais novo** (Ubuntu 24.04+), porque e nessa base que ele e montado |
            | Windows x64 | `PlayAmpNG-<versao>-setup.exe` — instala no perfil do usuario, sem pedir administrador |
            | Linux (Flatpak) | `PlayAmpNG.flatpak` — `flatpak install --user PlayAmpNG.flatpak`; nao tem o piso de glibc do AppImage, porque roda sobre o runtime do KDE |

            | macOS (Apple Silicon) | `PlayAmpNG-<versao>-macos-arm64.dmg` — **sem assinatura e ainda nao testado em um Mac de verdade**. Na primeira abertura o macOS bloqueia: clique com o botao direito no app e escolha *Abrir*, ou rode `xattr -dr com.apple.quarantine /Applications/PlayAmpNG.app`. Macs com processador Intel nao sao atendidos por este pacote |

            Confira os arquivos com `SHA256SUMS.txt`.

            ## Licenca

            PlayAmpNG e GPL-3.0-or-later. Os dois pacotes embutem FFmpeg
            compilado com `--enable-gpl --enable-version3`; o codigo-fonte
            correspondente do FFmpeg esta em https://github.com/FFmpeg/FFmpeg
            e os binarios usados vem de https://github.com/BtbN/FFmpeg-Builds.
            Ver `docs/DEPENDENCIES.md`.
